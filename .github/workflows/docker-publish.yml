name: Build, Test & Publish Docker Image

on:
  push:
    branches:
      - 'main'
      - '[0-9].*'
  pull_request:
    branches:
      - 'main'
      - '[0-9].*'
  release:
    types: [published]

jobs:
  pipeline:
    name: Build, Test & Publish Pipeline
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Dockerfile changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            dockerfile:
              - 'Dockerfile'

      - name: Determine Target Image Tags
        id: meta
        if: steps.changes.outputs.dockerfile == 'true' || github.event_name == 'release'
        run: |
          # Variable Definitions
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          REPO_PATH="${{ github.repository }}"

          # Parse expected PHP version from Dockerfile
          PHP_VERSION=$(sed -nE 's/^FROM php:([0-9]+\.[0-9]+).*/\1/p' Dockerfile)

          PRIMARY_TAG="${REPO_PATH}:${PHP_VERSION}"
          TAGS="${PRIMARY_TAG}"

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.ref_name }}" # e.g., 8.5-v1.0.0

            # Ensure tag prefix matches Dockerfile version
            if [[ "$TAG_NAME" != "${PHP_VERSION}-v"* ]]; then
              echo "::error::Tag '$TAG_NAME' does not match required format '${PHP_VERSION}-vX.Y.Z' for this branch!"
              exit 1
            fi

            # Publish both explicit release tag and update the rolling PHP version tag
            TAGS="${REPO_PATH}:${TAG_NAME},${PRIMARY_TAG}"

            # Check if this branch is the default branch to attach 'latest'
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            DEFAULT_PHP_VERSION=$(git show "origin/${DEFAULT_BRANCH}:Dockerfile" 2>/dev/null | sed -nE 's/^FROM php:([0-9]+\.[0-9]+).*/\1/p' || echo "$PHP_VERSION")

            if [ "$PHP_VERSION" = "$DEFAULT_PHP_VERSION" ]; then
              TAGS="${TAGS},${REPO_PATH}:latest"
            fi
          fi

          # Output values for downstream steps
          echo "PRIMARY_TAG=${PRIMARY_TAG}" >> $GITHUB_OUTPUT
          echo "TAGS=${TAGS}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: steps.changes.outputs.dockerfile == 'true' || github.event_name == 'release'
        uses: docker/setup-buildx-action@v4

      - name: Build Image for Testing
        if: steps.changes.outputs.dockerfile == 'true' || github.event_name == 'release'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.PRIMARY_TAG }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}

      - name: Verify Image Integrity
        if: steps.changes.outputs.dockerfile == 'true' || github.event_name == 'release'
        run: |
          TEST_IMG="${{ steps.meta.outputs.PRIMARY_TAG }}"

          echo "============================================================"
          echo "Checking CLI Utilities"
          echo "============================================================"
          docker run --rm "$TEST_IMG" bash -c '
            for item in "bash --version" "ssh -V" "rsync --version" "composer --version"; do
              cmd=$(echo "$item" | awk "{print \$1}")
              if command -v "$cmd" >/dev/null 2>&1; then
                printf "[OK] CLI Utility: %s\n" "$($item 2>&1 | head -n 1)"
              else
                printf "[FAIL] CLI Utility: %s is not installed\n" "$cmd"
                exit 1
              fi
            done
          '
          echo ""

          echo "============================================================"
          echo "Checking ODBC Driver"
          echo "============================================================"
          docker run --rm "$TEST_IMG" cat /etc/odbcinst.ini | grep -i "msodbcsql"
          echo ""

          echo "============================================================"
          echo "Checking PHP Extensions"
          echo "============================================================"
          INSTALLED_EXTS=$(docker run --rm "$TEST_IMG" php -m)
          REQUIRED_EXTS="bcmath bz2 exif gd gmp imagick intl pdo_mysql pdo_pgsql pdo_sqlsrv sqlsrv zip"
          for ext in $REQUIRED_EXTS; do
            if echo "$INSTALLED_EXTS" | grep -i -q "^${ext}$"; then
              printf "[OK] Extension loaded: %s\n" "$ext"
            else
              printf "[FAIL] Missing required extension: %s\n" "$ext"
              exit 1
            fi
          done

      - name: Log in to Docker Hub
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Release Image to Docker Hub
        if: github.event_name == 'release'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.TAGS }}
          cache-from: type=gha,scope=${{ github.ref_name }}
